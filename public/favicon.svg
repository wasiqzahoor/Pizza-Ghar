<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#E63946"/>

  <!-- Pizza slice -->

  <path d="M20 14 L46 14 L32 48 Z" fill="#FFD166"/>

  <!-- Crust -->

  <rect x="20" y="14" width="26" height="6" rx="3" fill="#C47A2C"/>

  <!-- Pepperoni -->

  <circle cx="32" cy="26" r="3" fill="#E63946"/>
  <circle cx="27" cy="34" r="3" fill="#E63946"/>
  <circle cx="37" cy="34" r="3" fill="#E63946"/>

  <!-- POS line -->

  <rect x="18" y="50" width="28" height="3" rx="1.5" fill="white"/>
</svg>
